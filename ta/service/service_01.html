<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <title>부가서비스_조회화면</title> 
	<link rel="icon" href="img/favicon.png" type="image/x-icon"> 
	<link rel="stylesheet" type="text/css" href="css/reset.css" />
	<link rel="stylesheet"type="text/css"  href="css/jquery-ui.css">
	<link rel="stylesheet" type="text/css" href="css/service.css" />
	<script type="text/javascript" src="js/jquery-1.9.1.min.js"></script>
	<script type="text/javascript" src="js/jquery-ui.js"></script>
	<script type="text/javascript" src="js/swiper-bundle.min.js"></script>
</head>
<body>
	<div class="theme" id="color">
		<div class="header">
			<h1><img src="img/univ_logo.png" alt="대학교 로고" /></h1>
			<h2 class="title"><p class="tit1">2024학년도 중앙대학교</p><p class="t_blue"><span class="tit2">전반기 신입생 모집</span><span class="tit3">접수확인</span></p></h2>
		</div>
		<div class="wrap">			
			<div id="container">
				<div class="content">
					<h3 class="h3_tit"><span class="star">*</span>인증 페이지 안내 문구(위) 영역</h3>
					<div class="form_box">
						<div class="con_form">
							<h4 class="h4_tit">인증 수단 1 성명</h4>
							<input type="text"  class="input_txt" placeholder="이름을 입력하세요" />
							<p class="error_msg">error message 영역</p>
						</div>
						<div class="con_form"> 
							<h4 class="h4_tit">생년월일</h4>
							<input type="text"  class="input_txt" placeholder="생년월일 6자리를 입력하세요"/>
						</div>
						<div class="con_form">
							<h4 class="h4_tit">이메일</h4>
							<div class="wrap_email">
								<input type="text" class="input_txt" /><span>@</span>	<input type="text" class="input_txt" />
							</div>
						</div>
						<div class="con_form"> 
							<h4 class="h4_tit">유웨이어플라이 ID</h4>
							<input type="text"  class="input_txt" placeholder="ID를 입력하세요"/>
						</div>
						<div class="con_form"> 
							<h4 class="h4_tit">유웨이어플라이 비밀번호</h4>
							<input type="password"  class="input_txt" placeholder="비밀번호를 입력하세요."/>
						</div>
						<div class="con_form">
							<h4 class="h4_tit">휴대전화번호</h4>
							<input type="text"  class="input_txt" placeholder="휴대전화번호를 입력하세요"/>
						</div>
						<div class="con_form">
							<h4 class="h4_tit">휴대전화번호</h4>
							<div class="wrap_phoneCertify">
								<input type="text"  class="input_txt" placeholder="휴대전화번호를 입력하세요"/>
								<button class="btn btn_certify">인증하기</button>
							</div>
						</div>
						<div class="con_form">
							<h4 class="h4_tit">휴대전화번호</h4>
							<div class="wrap_phoneCertify">
								<input type="text"  class="input_txt" placeholder="휴대전화번호를 입력하세요"/>
								<button class="btn btn_certify done">인증완료</button>
							</div>
						</div>
					</div> <!-- // form_box -->
					<div class="btn_wrap">
						<button class="btn btn_pink"><span class="txt">다음 페이지로 이동 버튼</span></button>
					</div> <!-- // btn_wrap -->
				</div>  <!-- // content -->
				
				<div class="bt_area">					
					<div class="info_txt_box">
						<p class="info_tit"><u>인증 페이지 안내 문구(밑) 영역</u></p>
						<p class="info_txt"><u>인증 페이지 안내 문구 1</u></p>
						<p class="info_txt">인증 페이지 안내 문구 2</p>
					</div>
				</div> <!-- // bt_area -->
			</div>  <!-- // container -->
		</div>	<!-- // wrap -->
	</div>

</body>
</html>
